<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PointX" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://pointxtech.com/" />
    <meta property="og:title" content="PointX — Software Engineering Studio for Digital Products" />
    <meta property="og:description" content="PointX is a software engineering studio building scalable web applications, mobile apps, and backend systems — from product discovery through launch and scale." />
    <meta property="og:image" content="https://pointxtech.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="629" />
    <meta property="og:image:alt" content="PointX — software engineering studio" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PointX — Software Engineering Studio for Digital Products" />
    <meta name="twitter:description" content="PointX is a software engineering studio building scalable web applications, mobile apps, and backend systems — from product discovery through launch and scale." />
    <meta name="twitter:image" content="https://pointxtech.com/og-image.png" />
    <meta name="twitter:image:alt" content="PointX — software engineering studio" />

    <!-- Above-the-fold font weights preloaded (400 body, 700 headings) -->
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://pointxtech.com/#organization",
            "name": "PointX",
            "url": "https://pointxtech.com/",
            "logo": "https://pointxtech.com/favicon.svg",
            "image": "https://pointxtech.com/og-image.png",
            "description": "PointX is a software engineering studio that designs, builds, and scales digital products for ambitious businesses."
          },
          {
            "@type": "WebSite",
            "@id": "https://pointxtech.com/#website",
            "url": "https://pointxtech.com/",
            "name": "PointX",
            "description": "Software engineering studio building scalable web applications, mobile apps, and backend systems.",
            "publisher": { "@id": "https://pointxtech.com/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "WebPage",
            "@id": "https://pointxtech.com/#webpage",
            "url": "https://pointxtech.com/",
            "name": "PointX — Software Engineering Studio for Digital Products",
            "description": "PointX is a software engineering studio building scalable web applications, mobile apps, and backend systems — from product discovery through launch and scale.",
            "isPartOf": { "@id": "https://pointxtech.com/#website" },
            "about": { "@id": "https://pointxtech.com/#organization" },
            "primaryImageOfPage": { "@id": "https://pointxtech.com/#primaryimage" },
            "inLanguage": "en"
          },
          {
            "@type": "ImageObject",
            "@id": "https://pointxtech.com/#primaryimage",
            "url": "https://pointxtech.com/og-image.png",
            "width": 1200,
            "height": 629
          }
        ]
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Local Inter — only weights used by the design */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/inter-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/inter-700.woff2') format('woff2');
      }
      body { margin: 0; background: #0A0A0C; color: #F4F4F6; font-family: Inter, system-ui, sans-serif; }
      :root[data-theme="light"] body { background: #FAFAFA; color: #111118; }
      #app-skeleton { min-height: 100vh; padding: 24px; }
      .skeleton-bar { height: 14px; border-radius: 999px; background: #22222A; animation: pulse 1.5s ease-in-out infinite; }
      :root[data-theme="light"] .skeleton-bar { background: #D4D4D8; }
      .skeleton-hero { max-width: 720px; padding-top: 18vh; }
      .skeleton-title { width: min(90vw, 620px); height: clamp(80px, 16vw, 180px); margin: 24px 0; border-radius: 16px; background: #121216; animation: pulse 1.5s ease-in-out infinite; }
      :root[data-theme="light"] .skeleton-title { background: #F4F4F5; }
      .skeleton-copy { width: min(90vw, 480px); }
      @keyframes pulse { 50% { opacity: .55; } }
      @media (prefers-reduced-motion: reduce) { .skeleton-bar, .skeleton-title { animation: none; } }
    </style>
    <script>
      // Prevent theme flash: apply stored/preferred theme before paint
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-skeleton" aria-hidden="true">
        <div class="skeleton-bar" style="width: 96px"></div>
        <div class="skeleton-hero">
          <div class="skeleton-bar" style="width: 220px"></div>
          <div class="skeleton-title"></div>
          <div class="skeleton-copy">
            <div class="skeleton-bar" style="width: 100%; margin-bottom: 12px"></div>
            <div class="skeleton-bar" style="width: 78%"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
