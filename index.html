    <style>
      /* Local Inter — only weights used by the design */
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/inter-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/inter-700.woff2") format("woff2");
      }
      body {
        margin: 0;
        background: #0a0a0c;
        color: #f4f4f6;
        font-family: Inter, system-ui, sans-serif;
      }
      :root[data-theme="light"] body {
        background: #fafafa;
        color: #111118;
      }
      #app-skeleton {
        min-height: 100vh;
        padding: 24px;
      }
      .skeleton-bar {
        height: 14px;
        border-radius: 999px;
        background: #22222a;
        animation: pulse 1.5s ease-in-out infinite;
      }
      :root[data-theme="light"] .skeleton-bar {
        background: #d4d4d8;
      }
      .skeleton-hero {
        max-width: 720px;
        padding-top: 18vh;
      }
      .skeleton-title {
        width: min(90vw, 620px);
        height: clamp(80px, 16vw, 180px);
        margin: 24px 0;
        border-radius: 16px;
        background: #121216;
        animation: pulse 1.5s ease-in-out infinite;
      }
      :root[data-theme="light"] .skeleton-title {
        background: #f4f4f5;
      }
      .skeleton-copy {
        width: min(90vw, 480px);
      }
      @keyframes pulse {
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .skeleton-bar,
        .skeleton-title {
          animation: none;
        }
      }
    </style>
    <script>
      // Prevent theme flash: apply stored/preferred theme before paint
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

  <body>

          <div class="skeleton-bar" style="width: 220px"></div>
          <div class="skeleton-title"></div>
          <div class="skeleton-copy">
            <div
              class="skeleton-bar"
              style="width: 100%; margin-bottom: 12px"
            ></div>
            <div class="skeleton-bar" style="width: 78%"></div>
          </div>
        </div>
      </div>
    </div>
